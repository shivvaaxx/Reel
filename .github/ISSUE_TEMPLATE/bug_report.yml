name: Bug report
description: Something doesn't work as it should.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: input
    id: link
    attributes:
      label: Link
      description: The link you were downloading, if it's public.
  - type: textarea
    id: log
    attributes:
      label: Log
      description: Right-click the download in Reel and choose Show Log, then paste it here.
      render: text
  - type: input
    id: reel
    attributes:
      label: Reel version
      description: Reel › About Reel.
      placeholder: "1.4.0"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "26.1"
    validations:
      required: true
